<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LinkJS</title>
    <style>
      body { margin: 0; font: 12px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #ddd; background: #1e1e2e; }
      header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #2a2a3a; position: sticky; top: 0; background: #1e1e2e; }
      header button { background: transparent; border: 1px solid #3a3a52; color: #cdd0dc; border-radius: 6px; cursor: pointer; padding: 2px 8px; }
      header .muted { color: #777c8f; }
      pre { margin: 0; padding: 12px; white-space: pre-wrap; word-break: break-word; }
      .err { color: #ff6b6b; padding: 12px; }
    </style>
  </head>
  <body>
    <header>
      <strong>LinkJS</strong>
      <span class="muted" id="status">connecting…</span>
      <span style="flex: 1"></span>
      <button id="refresh">刷新</button>
    </header>
    <pre id="out"></pre>
    <script src="panel.js"></script>
  </body>
</html>
